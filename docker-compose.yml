services:
  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - app-network

  # Telegram Bot
  applications_bot:
    image: ghcr.io/nemopss/ksu-applications-bot:latest
    env_file:
      - .env
    restart: always
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./database:/app/database
    networks:
      - app-network

  # FastAPI Backend
  api:
    image: ghcr.io/nemopss/ksu-applications-bot-api:latest
    env_file:
      - .env
    restart: always
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./database:/app/database
    expose:
      - "8001"
    networks:
      - app-network

  # React Frontend
  app:
    image: ghcr.io/nemopss/ksu-applications-bot-app:latest
    restart: always
    expose:
      - "80"
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - app
    networks:
      - app-network

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
