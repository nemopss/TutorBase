name: Build & Deploy

on:
  push:
    branches: [master]

concurrency:
  group: tutorbase-production
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      nginx: ${{ steps.filter.outputs.nginx }}
      compose: ${{ steps.filter.outputs.compose }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      deploy: ${{ steps.filter.outputs.bot == 'true' || steps.filter.outputs.api == 'true' || steps.filter.outputs.app == 'true' || steps.filter.outputs.nginx == 'true' || steps.filter.outputs.compose == 'true' || steps.filter.outputs.monitoring == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bot:
              - '.github/workflows/deploy.yml'
              - 'Dockerfile'
              - 'bot.py'
              - 'handlers/**'
              - 'middlewares/**'
              - 'filters/**'
              - 'notifications/**'
              - 'services/**'
              - 'utils/**'
              - 'config.py'
              - 'requirements.txt'
              - 'alembic/**'
              - 'database/**'
              - 'push.py'
              - 'keyboards/**'
            api:
              - '.github/workflows/deploy.yml'
              - 'Dockerfile.api'
              - 'api/**'
              - 'notifications/**'
              - 'alembic/**'
              - 'database/**'
              - 'services/**'
              - 'src/**'
              - 'utils/**'
              - 'config.py'
              - 'requirements.txt'
              - 'push.py'
              - 'scripts/**'
            app:
              - '.github/workflows/deploy.yml'
              - 'mini-app/**'
              - 'push.py'
            nginx:
              - 'nginx/**'
            compose:
              - 'docker-compose.yml'
              - 'certbot/**'
              - 'scripts/**'
            monitoring:
              - 'monitoring/**'

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      BOT_TOKEN: "1234567890:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      ADMIN_CHAT_ID: "1"
      LOGS_CHAT_ID: "1"
      CANCELLATION_IMAGE_FILE_ID: "ci-placeholder"
      ADMINS: "[1]"
      REDIS_URL: redis://localhost:6379/0
      REMINDER_NOTIFY_USERNAME: ci
      JWT_SECRET: ci-placeholder-secret-at-least-32-characters
      DEV_MODE: "true"
      POSTGRESQL_HOST: localhost
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USER: app
      POSTGRESQL_PASSWORD: app
      POSTGRESQL_DBNAME: app
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mini-app/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build

  build:
    needs: [changes, test-backend, test-frontend]
    if: ${{ needs.changes.outputs.bot == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Bot image
        if: ${{ needs.changes.outputs.bot == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tutorbase-bot:latest
            ghcr.io/${{ github.repository_owner }}/tutorbase-bot:sha-${{ github.sha }}

      - name: Build and push API image
        if: ${{ needs.changes.outputs.api == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tutorbase-api:latest
            ghcr.io/${{ github.repository_owner }}/tutorbase-api:sha-${{ github.sha }}

      - name: Build and push App image
        if: ${{ needs.changes.outputs.app == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./mini-app
          file: ./mini-app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tutorbase-app:latest
            ghcr.io/${{ github.repository_owner }}/tutorbase-app:sha-${{ github.sha }}
          build-args: |
            VITE_TELEGRAM_BOT_USERNAME=tutorbaserobot

  deploy:
    needs: [changes, test-backend, test-frontend, build]
    runs-on: ubuntu-latest
    if: ${{ always() && github.ref == 'refs/heads/master' && needs.changes.outputs.deploy == 'true' && needs.test-backend.result == 'success' && needs.test-frontend.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /srv/tutorbase/current
            git pull --ff-only
            compose_changed="${{ needs.changes.outputs.compose }}"
            monitoring_changed="${{ needs.changes.outputs.monitoring }}"

            flower_was_running="false"
            if docker compose ps --services --filter status=running | grep -q '^flower$'; then
              flower_was_running="true"
            fi

            monitoring_was_running="false"
            if docker compose ps --services --filter status=running | grep -Eq '^(prometheus|grafana)$'; then
              monitoring_was_running="true"
            fi

            services=""
            if [ "${{ needs.changes.outputs.bot }}" = "true" ]; then
              services="$services bot"
            fi
            if [ "${{ needs.changes.outputs.api }}" = "true" ]; then
              services="$services api celery_worker celery_beat"
              if [ "$flower_was_running" = "true" ]; then
                services="$services flower"
              fi
            fi
            if [ "${{ needs.changes.outputs.app }}" = "true" ]; then
              services="$services app"
            fi

            if [ -n "$services" ]; then
              docker compose pull $services
              if [ "${{ needs.changes.outputs.api }}" = "true" ]; then
                echo "Applying database migrations before restarting application services..."
                docker compose run --rm --no-deps api alembic upgrade head
              fi
              docker compose up -d $services
            fi

            if [ "$compose_changed" = "true" ]; then
              docker compose up -d --remove-orphans
              if [ "$flower_was_running" != "true" ]; then
                docker compose stop flower || true
              fi
            fi

            if [ "$monitoring_was_running" = "true" ] && { [ "$monitoring_changed" = "true" ] || [ "$compose_changed" = "true" ]; }; then
              docker compose --profile monitoring up -d --force-recreate prometheus grafana
            fi

            if [ "${{ needs.changes.outputs.nginx }}" = "true" ] || [ "${{ needs.changes.outputs.api }}" = "true" ] || [ "${{ needs.changes.outputs.app }}" = "true" ] || [ "$compose_changed" = "true" ]; then
              docker compose up -d nginx
              docker compose exec nginx nginx -s reload || true
            fi

            if [ "${{ needs.changes.outputs.api }}" = "true" ]; then
              echo "Checking API readiness..."
              docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=10).read()"
              docker compose exec -T celery_worker celery -A utils.celery_app inspect ping --timeout=10
            fi
