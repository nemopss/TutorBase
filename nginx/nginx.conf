# Main nginx configuration for the server

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=app_limit:10m rate=30r/s;

# Upstream for API
upstream api_backend {
    server api:8001;
}

# Upstream for Web App
upstream app_frontend {
    server app:80;
}

# Redirect HTTP to HTTPS for api.xpyrkova23.ru
server {
    listen 80;
    server_name api.xpyrkova23.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect HTTP to HTTPS for app.xpyrkova23.ru
server {
    listen 80;
    server_name app.xpyrkova23.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS configuration for API
server {
    listen 443 ssl;
    http2 on;
    server_name api.xpyrkova23.ru;

    # SSL certificates (will be managed by certbot)
    ssl_certificate /etc/letsencrypt/live/api.xpyrkova23.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xpyrkova23.ru/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers for API
    add_header Access-Control-Allow-Origin "https://app.xpyrkova23.ru" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Rate limiting
    limit_req zone=api_limit burst=20 nodelay;

    # Grafana monitoring dashboard
    # location /grafana/ {
    #     proxy_pass http://grafana:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
        
    #     # WebSocket support for Grafana live updates
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
        
    #     # Timeouts for long-running queries
    #     proxy_connect_timeout 300s;
    #     proxy_send_timeout 300s;
    #     proxy_read_timeout 300s;
    # }

    # Prometheus metrics (опционально - можно закрыть паролем)
    # location /prometheus/ {
    #     # Basic auth (раскомментируйте для защиты)
    #     # auth_basic "Restricted Access";
    #     # auth_basic_user_file /etc/nginx/.htpasswd;
        
    #     proxy_pass http://prometheus:9090/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
        
    #     # Timeouts
    #     proxy_connect_timeout 300s;
    #     proxy_send_timeout 300s;
    #     proxy_read_timeout 300s;
    # }

    # Proxy to FastAPI
    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Increase body size for file uploads
    client_max_body_size 10M;
}

# HTTPS configuration for Web App
server {
    listen 443 ssl;
    http2 on;
    server_name app.xpyrkova23.ru;

    # SSL certificates (will be managed by certbot)
    ssl_certificate /etc/letsencrypt/live/app.xpyrkova23.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.xpyrkova23.ru/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req zone=app_limit burst=50 nodelay;

    # Proxy API requests to FastAPI backend
    location /api/v1 {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy to React App
    location / {
        proxy_pass http://app_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
